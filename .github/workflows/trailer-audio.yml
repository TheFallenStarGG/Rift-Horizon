name: Generate trailer voices
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate every line, even unchanged ones'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/gen-trailer-audio.mjs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FORCE: ${{ inputs.force }}
      - name: Commit voices
        if: always()
        run: |
          git config user.name "trailer-bot"
          git config user.email "trailer-bot@users.noreply.github.com"
          git add -A assets/trailer/vo
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "Generate trailer voice lines"
            git push origin HEAD:${{ github.ref_name }}
          fi
