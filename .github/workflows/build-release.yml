# Builds Windows / macOS / Linux desktop + Android APK, vendors Three.js offline, auto-versions, releases.
name: Build & Release

on:
  push:
    branches: [main, master, Update-4]
    paths-ignore: ['**.md', '.gitignore']
  workflow_dispatch: {}

concurrency:
  group: build-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Auto version: 0.4.<run_number>
  APP_VERSION: 0.4.${{ github.run_number }}
  THREE_VERSION: '0.170.0'

jobs:
  # Flip BUILD_RELEASE in the repo root to True to allow APK/EXE builds.
  # Anything other than True (case-insensitive) cancels the expensive jobs.
  gate:
    name: Build gate
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Read BUILD_RELEASE flag
        id: check
        run: |
          set -e
          FLAG_FILE="BUILD_RELEASE"
          if [ ! -f "$FLAG_FILE" ]; then
            echo "No $FLAG_FILE in repo — treating as False (skip builds)"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Strip whitespace / BOM; accept True / true / TRUE only
          VAL=$(tr -d '\r' < "$FLAG_FILE" | head -1 | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          echo "BUILD_RELEASE raw value: [$VAL]"
          if [ "$VAL" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Gate OPEN — builds will run"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Gate CLOSED — BUILD_RELEASE is not True; skipping desktop/APK/release"
          fi

  windows:
    name: Windows (Portable + Setup Installer)
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Vendor Three.js (offline)
        shell: bash
        run: |
          chmod +x scripts/vendor-three.sh scripts/use-local-three.sh
          ./scripts/vendor-three.sh
          ./scripts/use-local-three.sh index.html

      - name: Stage game for Electron
        shell: bash
        run: |
          set -e
          rm -rf _game_stage
          mkdir -p _game_stage
          for item in index.html game.js favicon.png apple-touch-icon.png og.png lib assets vendor; do
            [ -e "$item" ] && cp -a "$item" _game_stage/
          done
          echo "${{ env.APP_VERSION }}" > _game_stage/version.txt
          # stamp desktop package version
          node -e "const p=require('./desktop/package.json');p.version=process.env.APP_VERSION;require('fs').writeFileSync('./desktop/package.json',JSON.stringify(p,null,2))"
        env:
          APP_VERSION: ${{ env.APP_VERSION }}

      - name: Install & build
        working-directory: desktop
        shell: bash
        run: |
          npm install
          npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: |
            desktop/dist/*Windows-Portable*.exe
            desktop/dist/*Windows-Setup*.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS (DMG Intel + Apple Silicon)
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Vendor Three.js (offline)
        run: |
          chmod +x scripts/vendor-three.sh scripts/use-local-three.sh
          ./scripts/vendor-three.sh
          ./scripts/use-local-three.sh index.html

      - name: Stage game for Electron
        run: |
          set -e
          rm -rf _game_stage
          mkdir -p _game_stage
          for item in index.html game.js favicon.png apple-touch-icon.png og.png lib assets vendor; do
            [ -e "$item" ] && cp -a "$item" _game_stage/
          done
          echo "${{ env.APP_VERSION }}" > _game_stage/version.txt
          node -e "const p=require('./desktop/package.json');p.version=process.env.APP_VERSION;require('fs').writeFileSync('./desktop/package.json',JSON.stringify(p,null,2))"
        env:
          APP_VERSION: ${{ env.APP_VERSION }}

      - name: Install & build
        working-directory: desktop
        run: |
          npm install
          npx electron-builder --mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Unsigned DMG is fine for GitHub Releases; users may need right-click → Open the first time
          APPLE_API_KEY: ''
          APPLE_API_KEY_ID: ''
          APPLE_API_ISSUER: ''

      - uses: actions/upload-artifact@v4
        with:
          name: macos-desktop
          path: desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux (AppImage + deb)
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Vendor Three.js (offline)
        run: |
          chmod +x scripts/vendor-three.sh scripts/use-local-three.sh
          ./scripts/vendor-three.sh
          ./scripts/use-local-three.sh index.html

      - name: Stage game for Electron
        run: |
          set -e
          rm -rf _game_stage
          mkdir -p _game_stage
          for item in index.html game.js favicon.png apple-touch-icon.png og.png lib assets vendor; do
            [ -e "$item" ] && cp -a "$item" _game_stage/
          done
          echo "${{ env.APP_VERSION }}" > _game_stage/version.txt
          node -e "const p=require('./desktop/package.json');p.version=process.env.APP_VERSION;require('fs').writeFileSync('./desktop/package.json',JSON.stringify(p,null,2))"
        env:
          APP_VERSION: ${{ env.APP_VERSION }}

      - name: Install & build
        working-directory: desktop
        run: |
          npm install
          npx electron-builder --linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/android-sdk
            ~/.android/cache
          key: android-sdk-34-${{ runner.os }}-v2
          restore-keys: android-sdk-34-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-capacitor6-v1
          restore-keys: |
            gradle-${{ runner.os }}-capacitor6-
            gradle-${{ runner.os }}-

      - name: Install Android SDK command-line tools
        run: |
          set -e
          ANDROID_ROOT="$HOME/android-sdk"
          if [ ! -x "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_ROOT/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_ROOT/cmdline-tools"
            rm -rf "$ANDROID_ROOT/cmdline-tools/latest"
            mv "$ANDROID_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_ROOT/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install platform packages
        run: |
          set -e
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Capacitor deps
        run: npm install

      - name: Vendor Three.js (offline)
        run: |
          chmod +x scripts/vendor-three.sh scripts/use-local-three.sh scripts/polish-android.sh
          ./scripts/vendor-three.sh

      - name: Stage web assets into www/
        run: |
          set -e
          rm -rf www
          mkdir -p www
          for item in index.html game.js favicon.png apple-touch-icon.png og.png lib assets vendor; do
            [ -e "$item" ] && cp -a "$item" www/
          done
          ./scripts/use-local-three.sh www/index.html
          echo "${{ env.APP_VERSION }}" > www/version.txt
          # inject native back hook
          if [ -f scripts/native-bridge-snippet.js ]; then
            cat scripts/native-bridge-snippet.js >> www/game.js
          fi
          test -f www/index.html
          test -f www/vendor/three/build/three.module.js

      - name: Add Android platform & sync
        run: |
          set -e
          npx cap add android
          npx cap sync android


      - name: Apply favicon + polish
        run: |
          set -euo pipefail
          chmod +x scripts/polish-android.sh
          ./scripts/polish-android.sh

          # Android AAPT is strict: raw favicon.png often fails ("file failed to compile").
          # Convert to proper sRGB PNG32 at standard launcher sizes, or skip icons on failure.
          python3 << 'ENDPY'
          import subprocess, sys
          from pathlib import Path

          src = Path("favicon.png")
          if not src.exists():
              print("No favicon.png — keeping Capacitor default icons")
              sys.exit(0)

          try:
              from PIL import Image
          except ImportError:
              subprocess.check_call([sys.executable, "-m", "pip", "install", "pillow", "-q"])
              from PIL import Image

          im = Image.open(src)
          im = im.convert("RGBA")
          # Flatten onto opaque dark background (adaptive/legacy launchers prefer this)
          bg = Image.new("RGBA", im.size, (10, 12, 16, 255))
          bg.alpha_composite(im)
          im = bg.convert("RGBA")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in sizes.items():
              d = Path("android/app/src/main/res") / folder
              d.mkdir(parents=True, exist_ok=True)
              # Remove adaptive XML that can conflict with PNG launchers
              for junk in d.glob("*.xml"):
                  junk.unlink()
              icon = im.resize((size, size), Image.Resampling.LANCZOS)
              for name in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"):
                  out = d / name
                  icon.save(out, format="PNG", optimize=True)
                  print("wrote", out, out.stat().st_size)

          # Drop anydpi adaptive wrappers if present (use density PNGs only)
          anydpi = Path("android/app/src/main/res/mipmap-anydpi-v26")
          if anydpi.exists():
              for f in anydpi.glob("ic_launcher*.xml"):
                  f.unlink()
                  print("removed", f)
          print("Launcher icons converted OK")
          ENDPY

          # versionName
          if [ -f android/app/build.gradle ]; then
            sed -i "s/versionName \".*\"/versionName \"${{ env.APP_VERSION }}\"/" android/app/build.gradle || true
          fi

      - name: Cache / create persistent signing keystore
        uses: actions/cache@v4
        id: keystore
        with:
          path: signing/release.jks
          key: rifthorizon-android-keystore-v1

      - name: Ensure keystore exists
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p signing
          STORE_PASS="${KEYSTORE_PASSWORD:-rifthorizon-ci-store}"
          KEY_PASS="${KEY_PASSWORD:-rifthorizon-ci-key}"
          if [ ! -f signing/release.jks ]; then
            keytool -genkeypair -v -storetype JKS -keyalg RSA -keysize 2048 -validity 10000               -alias rifthorizon               -keystore signing/release.jks               -storepass "$STORE_PASS"               -keypass "$KEY_PASS"               -dname "CN=Rift Horizon, OU=Game, O=TheFallenStarGG, C=US"
            echo "Generated new release keystore (cached for future runs)"
          else
            echo "Reusing cached release keystore"
          fi
          echo "STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"


      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ env.STORE_PASS }}
          KEY_PASSWORD: ${{ env.KEY_PASS }}
          KEYSTORE_PATH: ${{ github.workspace }}/signing/release.jks
        run: |
          set -euo pipefail
          chmod +x gradlew
          test -f "$KEYSTORE_PATH"
          python3 << 'ENDPY'
          import os, re
          from pathlib import Path

          p = Path("app/build.gradle")
          if not p.exists():
              # Capacitor 7 sometimes uses .kts — fail clearly
              alts = list(Path("app").glob("build.gradle*"))
              raise SystemExit(f"app/build.gradle not found; found={alts}")

          t = p.read_text()
          ks = os.environ["KEYSTORE_PATH"].replace("\\", "/")
          store = os.environ.get("KEYSTORE_PASSWORD") or "rifthorizon-ci-store"
          key = os.environ.get("KEY_PASSWORD") or "rifthorizon-ci-key"

          # Remove prior signingConfigs blocks (best-effort)
          t = re.sub(r"signingConfigs\s*\{(?:[^{}]|\{[^{}]*\})*\}", "", t)

          signing_block = (
              "    signingConfigs {\n"
              "        release {\n"
              f'            storeFile file("{ks}")\n'
              f'            storePassword "{store}"\n'
              '            keyAlias "rifthorizon"\n'
              f'            keyPassword "{key}"\n'
              "        }\n"
              "    }\n"
          )

          if "android {" in t:
              t = t.replace("android {", "android {\n" + signing_block, 1)
          else:
              raise SystemExit("no android { in build.gradle")

          if "signingConfig signingConfigs.release" not in t:
              t2, n = re.subn(
                  r"(release\s*\{)",
                  r"\1\n            signingConfig signingConfigs.release",
                  t,
                  count=1,
              )
              t = t2 if n else t

          t = t.replace("minifyEnabled true", "minifyEnabled false")
          p.write_text(t)
          print("Patched", p)
          for i, line in enumerate(p.read_text().splitlines(), 1):
              low = line.lower()
              if "signing" in low or "storefile" in low or "keyalias" in low:
                  print(f"{i}:{line}")
          ENDPY

          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          set -e
          mkdir -p out
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" "out/RiftHorizon-${{ env.APP_VERSION }}-android.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [gate, windows, macos, linux, android]
    if: needs.gate.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows desktop
        uses: actions/download-artifact@v4
        with:
          name: windows-desktop
          path: release-assets

      - name: Download macOS desktop
        uses: actions/download-artifact@v4
        with:
          name: macos-desktop
          path: release-assets

      - name: Download Linux desktop
        uses: actions/download-artifact@v4
        with:
          name: linux-desktop
          path: release-assets

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Debounce — skip if a release was published in the last 10 minutes
        id: debounce
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PUBLISHED=$(gh api "repos/${{ github.repository }}/releases?per_page=1" --jq '.[0].published_at // empty' 2>/dev/null || true)
          if [ -z "$PUBLISHED" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NOW=$(date -u +%s)
          THEN=$(date -u -d "$PUBLISHED" +%s)
          AGE=$(( NOW - THEN ))
          echo "Last release ${AGE}s ago"
          if [ "$AGE" -lt 600 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build short changelog
        if: steps.debounce.outputs.skip != 'true'
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PREV=$(gh api "repos/${{ github.repository }}/releases?per_page=1" --jq '.[0].tag_name // empty' 2>/dev/null || true)
          {
            echo "### Changelog"
            echo ""
            if [ -n "$PREV" ] && git rev-parse "$PREV" >/dev/null 2>&1; then
              COUNT=$(git rev-list --count "${PREV}..HEAD" 2>/dev/null || echo 0)
              echo "Since \`$PREV\` (${COUNT} commits):"
              echo ""
              git log --oneline --no-merges "${PREV}..HEAD" | head -12 | while read -r line; do echo "- $line"; done
            else
              git log --oneline --no-merges -8 | while read -r line; do echo "- $line"; done
            fi
            echo ""
            echo "---"
            echo ""
            echo "**v${{ env.APP_VERSION }}** · \`${{ github.ref_name }}\` · \`${{ github.sha }}\`"
            echo ""
            echo "### Downloads"
            echo ""
            echo "| File | What it is |"
            echo "|------|------------|"
            echo "| \`RiftHorizon-…-Windows-Portable-x64.exe\` | **Windows portable** — no install, double-click to run |"
            echo "| \`RiftHorizon-…-Windows-Setup-Installer-x64.exe\` | **Windows setup** — installer with Start Menu + desktop shortcuts |"
            echo "| \`RiftHorizon-…-macOS-x64.dmg\` | **macOS Intel** — open the DMG, drag the app to Applications |"
            echo "| \`RiftHorizon-…-macOS-arm64.dmg\` | **macOS Apple Silicon** (M1/M2/M3/M4) |"
            echo "| \`RiftHorizon-…-Linux-x64.AppImage\` | **Linux AppImage** — chmod +x then run (no install) |"
            echo "| \`RiftHorizon-…-Linux-x64.deb\` | **Linux deb** — for Debian/Ubuntu (\`sudo dpkg -i …\`) |"
            echo "| \`RiftHorizon-…-android.apk\` | **Android** — signed release APK (landscape) |"
            echo ""
            echo "All desktop builds ship with Three.js vendored offline."
          } > /tmp/body.md
          echo "path=/tmp/body.md" >> "$GITHUB_OUTPUT"
          cat /tmp/body.md

      - name: Create release
        if: steps.debounce.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Rift Horizon v${{ env.APP_VERSION }}
          body_path: ${{ steps.notes.outputs.path }}
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debounce notice
        if: steps.debounce.outputs.skip == 'true'
        run: echo "Release skipped (debounce). Artifacts still available on this Actions run."
