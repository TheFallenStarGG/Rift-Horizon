# Lives ONLY on Rift-Horizon-Dev. Pulls preserve this file so it is not wiped by main.
#
# Secret on Dev: RIFT_SYNC_TOKEN
#   Classic PAT: repo + workflow
#   Fine-grained: Contents R/W + Workflows R/W on Rift-Horizon and Rift-Horizon-Dev

name: Sync with Rift-Horizon

on:
  workflow_dispatch:
    inputs:
      direction:
        description: 'Direction'
        type: choice
        required: true
        options:
          - pull
          - push
        default: pull
      main_branch:
        description: 'Branch on Rift-Horizon (created on push if missing)'
        required: true
        default: 'Update-6.1'
      dev_branch:
        description: 'Branch on Rift-Horizon-Dev (blank = branch you ran this on)'
        required: false
        default: ''
      overwrite:
        description: 'Overwrite destination files (pull: hard reset + force push; push: Dev files replace the branch contents but Rift-Horizon history is kept, no force push)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: sync-rift-horizon
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check token
        env:
          T: ${{ secrets.RIFT_SYNC_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::error::Missing secret RIFT_SYNC_TOKEN (repo + workflow scopes)."
            exit 1
          fi

      - name: Checkout Dev repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RIFT_SYNC_TOKEN }}
          ref: ${{ github.ref }}

      - name: Resolve branches
        id: br
        run: |
          DEV="${{ inputs.dev_branch }}"
          [ -z "$DEV" ] && DEV="${GITHUB_REF_NAME}"
          MAIN="${{ inputs.main_branch }}"
          if [[ ! "$DEV"  =~ ^[A-Za-z0-9._/-]+$ ]] || [[ ! "$MAIN" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Invalid branch name"
            exit 1
          fi
          echo "dev=$DEV" >> "$GITHUB_OUTPUT"
          echo "main=$MAIN" >> "$GITHUB_OUTPUT"
          echo "dir=${{ inputs.direction }} dev=$DEV main=$MAIN overwrite=${{ inputs.overwrite }}"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote remove main 2>/dev/null || true
          git remote add main "https://x-access-token:${{ secrets.RIFT_SYNC_TOKEN }}@github.com/TheFallenStarGG/Rift-Horizon.git"
          git remote set-url origin "https://x-access-token:${{ secrets.RIFT_SYNC_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: Pull from Rift-Horizon → Dev
        if: inputs.direction == 'pull'
        env:
          DEV: ${{ steps.br.outputs.dev }}
          MAIN: ${{ steps.br.outputs.main }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          set -euo pipefail
          git fetch main "$MAIN"

          if git show-ref --verify --quiet "refs/heads/$DEV"; then
            git checkout "$DEV"
          elif git show-ref --verify --quiet "refs/remotes/origin/$DEV"; then
            git checkout -B "$DEV" "origin/$DEV"
          else
            git checkout -B "$DEV"
          fi

          # Keep this Dev-only workflow; main does not have it and would wipe it
          KEEP="/tmp/sync-rift-horizon.yml"
          if [ -f .github/workflows/sync-rift-horizon.yml ]; then
            cp .github/workflows/sync-rift-horizon.yml "$KEEP"
          else
            KEEP=""
          fi

          if [ "$OVERWRITE" = "true" ]; then
            git reset --hard "main/$MAIN"
          else
            git merge --ff-only "main/$MAIN"
          fi

          if [ -n "$KEEP" ] && [ -f "$KEEP" ]; then
            mkdir -p .github/workflows
            cp "$KEEP" .github/workflows/sync-rift-horizon.yml
            git add .github/workflows/sync-rift-horizon.yml
            if ! git diff --cached --quiet; then
              git commit -m "chore: keep Rift-Horizon-Dev sync workflow after pull"
            fi
          fi

          if [ "$OVERWRITE" = "true" ]; then
            git push origin "HEAD:refs/heads/$DEV" --force
            echo "Pulled main/$MAIN → origin/$DEV (force), sync workflow preserved"
          else
            git push origin "HEAD:refs/heads/$DEV"
            echo "Fast-forwarded origin/$DEV from main/$MAIN, sync workflow preserved"
          fi
          git log -3 --oneline

      - name: Push Dev → Rift-Horizon
        if: inputs.direction == 'push'
        env:
          DEV: ${{ steps.br.outputs.dev }}
          MAIN: ${{ steps.br.outputs.main }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          set -euo pipefail
          if [ "$DEV" != "${GITHUB_REF_NAME}" ]; then
            git fetch origin "$DEV"
            git checkout -B "$DEV" "origin/$DEV"
          else
            git checkout "$DEV" 2>/dev/null || git checkout -B "$DEV"
          fi

          # Do NOT push the Dev-only sync workflow onto the main game repo
          if [ -f .github/workflows/sync-rift-horizon.yml ]; then
            git rm -f --ignore-unmatch .github/workflows/sync-rift-horizon.yml
            git commit -m "chore: strip Dev-only sync workflow before push to main" || true
          fi

          git fetch main "$MAIN" 2>/dev/null || true

          # Overwrite WITHOUT rewriting history: record the Rift-Horizon branch tip as a
          # parent via a merge commit that keeps Dev's files exactly (-s ours), so the
          # push below is a normal fast-forward and no force push is ever needed.
          if [ "$OVERWRITE" = "true" ] && git rev-parse --verify --quiet "refs/remotes/main/$MAIN" >/dev/null; then
            if ! git merge-base --is-ancestor "main/$MAIN" HEAD; then
              git merge -s ours --allow-unrelated-histories --no-edit \
                -m "chore: sync Dev into $MAIN (Dev files win, Rift-Horizon history kept)" \
                "main/$MAIN"
            fi
          fi

          git push main "HEAD:refs/heads/$MAIN"
          echo "Pushed Dev/$DEV → Rift-Horizon/$MAIN (without sync workflow, history preserved)"
          echo "https://github.com/TheFallenStarGG/Rift-Horizon/tree/$MAIN"
          git log -3 --oneline
